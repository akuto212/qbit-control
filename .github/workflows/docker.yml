name: CI and Docker image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Python checks
        run: |
          uv run --frozen --extra dev pytest -q
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Validate deployment configuration
        env:
          QBIT_API_KEY: qbt_aaaaaaaaaaaaaaaaaaaaaaaaaaaa
          QBT_CONTROL_HOST: qbt-control.example.com
          TRAEFIK_NETWORK: traefik
          QBIT_NETWORK: qbit-internal
          TRAEFIK_CERTRESOLVER: letsencrypt
          TRAEFIK_MIDDLEWARES: tinyauth@docker,security-headers@file
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: qbt-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root startup and healthcheck
        run: |
          docker run -d --name qbt-control-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --network none \
            --health-interval 2s --health-start-period 0s \
            -e QBIT_API_KEY=qbt_aaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e APP_ORIGIN=https://qbt-control.example.com \
            qbt-control:ci
          test "$(docker exec qbt-control-smoke id -u)" = "10001"
          for attempt in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' qbt-control-smoke)
            if [ "$health" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs qbt-control-smoke
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f qbt-control-smoke 2>/dev/null || true

  publish:
    name: Publish to GHCR
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
